[project]
name = "istari-labs-helpers"
version = "0.1.0"
description = "Entity-oriented wrapper over the Istari Digital Python client"
requires-python = ">=3.10"
dependencies = [
    "istari-digital-client",
    "python-dotenv",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]
experiment = [
    "plotly",
    "pandas",
    "numpy",
    "ipython",
    "jupyter",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["istari_labs_helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (require a live Istari platform)",
]
