[project]
name = "istari-digital-client-cookbook"
version = "0.1.0"
description = ""
authors = [{name = "Istari Digital Developers"}]
readme = "README.md"
requires-python = ">=3.10, <4.0"
license = { file = "LICENSE" }

classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]

[dependency-groups]
dev = [
    "istari-digital-client==10.10.0",
    "python-dotenv>=1.0",
    "pre-commit>=3.8.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "nbqa>=1.8",
    "ipykernel>=6.29",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pytest>=8.0",
]

[tool.ruff.lint.per-file-ignores]
# Notebooks: nbqa joins cells with separators; imports in later cells trigger E402 falsely.
"**/*.ipynb" = ["E402"]

[tool.nbqa.addopts]
# nbqa runs ruff on a temp .py copy, so the .ipynb per-file-ignores above never
# match — repeat the E402 exemption here for the nbqa-ruff pre-commit hook.
ruff = ["--extend-ignore=E402"]

[tool.nbqa.config]
addopts = ["--nbqa-mutate"]

[tool.nbqa.mutate]
ruff = true
mypy = false
