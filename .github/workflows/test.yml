name: 'Test'
# Temporarily disabled: not every notebook is currently runnable in CI
# (missing fixtures / long-running integrations). Re-enable the push / pull_request
# triggers below once the notebook suite is CI-ready. Manual runs via the
# "Run workflow" button are still available.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened

env:
  REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
  REGISTRY_URL: ${{ secrets.REGISTRY_URL }}

jobs:
  test-notebooks:
    name: Test Notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Register Jupyter kernel
        run: |
          uv run ipython kernel install --user --env VIRTUAL_ENV $(pwd)/.venv --name=python3

      - name: Run all notebooks
        run: |
          uv run python .github/scripts/run_notebooks.py
